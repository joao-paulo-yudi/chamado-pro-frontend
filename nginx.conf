# Preserva o protocolo original informado pelo ALB (HTTPS); usa o do NGINX se não houver
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # ------------------------------------------------------------------
    # Cabeçalhos de segurança (também aplicados às respostas da API)
    # ------------------------------------------------------------------
    # CSP: tudo servido pela própria origem. 'unsafe-inline' em style-src é
    # necessário para os estilos de componente do Angular.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # O TLS termina no ALB; o navegador só recebe este cabeçalho via HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header Authorization $http_authorization;
    proxy_hide_header X-Powered-By;

    # ------------------------------------------------------------------
    # API (backend Spring Boot)
    # ------------------------------------------------------------------
    location ^~ /auth/         { proxy_pass http://backend:8080; }
    location ^~ /usuarios      { proxy_pass http://backend:8080; }
    location ^~ /chamados      { proxy_pass http://backend:8080; }
    location ^~ /comentarios   { proxy_pass http://backend:8080; }
    location ^~ /notificacoes  { proxy_pass http://backend:8080; }
    location ^~ /sla-config    { proxy_pass http://backend:8080; }
    location ^~ /dashboard     { proxy_pass http://backend:8080; }

    # ------------------------------------------------------------------
    # SPA
    # ------------------------------------------------------------------
    location = /index.html {
        # Sempre buscar a versão mais nova do index (os assets têm hash no nome)
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Não servir arquivos ocultos (.git, .env etc.)
    location ~ /\. {
        deny all;
    }
}
