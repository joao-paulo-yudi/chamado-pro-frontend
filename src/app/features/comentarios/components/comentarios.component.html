<section class="comentarios-container" aria-labelledby="titulo-comentarios">

  <h3 id="titulo-comentarios">Comentários</h3>

  <p *ngIf="comentarios.length === 0" class="vazio">Nenhum comentário ainda.</p>

  <article *ngFor="let c of comentarios" class="comentario-item">
    <div class="comentario-header">
      <strong>{{ c.autorNome }}</strong>
      <span class="data">{{ c.dataCriacao | date:'dd/MM/yyyy HH:mm' }}</span>

      <button
        type="button"
        class="btn-danger btn-sm"
        *ngIf="podeExcluir(c)"
        [attr.aria-label]="'Excluir comentário de ' + c.autorNome"
        (click)="excluirComentario(c.id)">
        Excluir
      </button>
    </div>

    <p class="texto">
      {{ c.texto }}
    </p>
  </article>

  <div class="novo-comentario">
    <label for="novo-comentario-{{ chamadoId }}" class="sr-only">Novo comentário</label>
    <textarea
      id="novo-comentario-{{ chamadoId }}"
      [(ngModel)]="novoComentario"
      placeholder="Escreva um comentário..."
      maxlength="5000"
      rows="3">
    </textarea>

    <button type="button" class="btn" (click)="enviarComentario()">
      Enviar
    </button>
  </div>

</section>
