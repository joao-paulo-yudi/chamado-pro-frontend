<div>
    <div class="list-header">
        <button type="button" class="btn" (click)="novo()">Novo Usuário</button>
    </div>

    <div class="usuarios-grid">
        <div class="usuario-card" *ngFor="let u of usuarios">
            <div class="usuario-info">
                <strong>{{ u.nome }}</strong>
                <p>{{ u.email }}</p>
                <p><b>Tipo:</b> {{ u.tipoUsuario }}</p>
            </div>
            <button type="button" class="edit-btn" (click)="editar(u.id)" [attr.aria-label]="'Editar usuário ' + u.nome">
                <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
