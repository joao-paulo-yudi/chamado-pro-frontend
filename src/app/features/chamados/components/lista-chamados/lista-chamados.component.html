<div>
  <div class="list-header">
    <span>Total: {{ tickets?.length || 0 }}</span>
  </div>

  <div class="tickets-grid">
    <div *ngFor="let t of tickets" class="ticket-card" role="link" tabindex="0"
             (click)="open(t.id)" (keydown.enter)="open(t.id)">

      <div class="ticket-info">
        <strong class="ticket-title">{{ t.titulo }}</strong>

        <p><b>Descrição:</b> {{ t.descricao }}</p>
        <p><b>Criado em:</b> {{ t.dataCriacao | date:'dd/MM/yyyy HH:mm' }}</p>
      </div>

      <div class="ticket-badges">
        <span *ngIf="t.prioridade" class="badge" [ngClass]="'prioridade-' + t.prioridade">
          {{ prioridadeLabels[t.prioridade] || t.prioridade }}
        </span>
        <span *ngIf="t.statusSla" class="badge" [ngClass]="'sla-' + t.statusSla">
          {{ statusSlaLabels[t.statusSla] || t.statusSla }}
        </span>
      </div>

      <div class="ticket-meta">
        <span [ngClass]="statusClass(t.status)" class="status">{{ t.status }}</span>
      </div>

    </div>
  </div>
</div>
